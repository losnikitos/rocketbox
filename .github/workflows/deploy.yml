name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin host keys (Net::SSH checks "host,ip"). Do not use ssh-keyscan -H —
          # hashed entries caused HostKeyMismatch on this runner.
          cat >> ~/.ssh/known_hosts <<'EOF'
          monitoring.tadaaa.uk.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILeNJyMt1tmxmvLsl1aPUL/Vz5zefvoH1qIAMa17UHWs
          monitoring.tadaaa.uk.com ssh-rsa 
          monitoring.tadaaa.uk.com ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBKRSlQdXNbomq+nYVtmo+Udupo19TCjSd3St7qUU7CfqhngCbNUJVm6FwOAKuywdBXWXk/PZdynJ9dvbzF0WtuM=
          51.75.68.97 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILeNJyMt1tmxmvLsl1aPUL/Vz5zefvoH1qIAMa17UHWs
          monitoring.tadaaa.uk.com,51.75.68.97 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILeNJyMt1tmxmvLsl1aPUL/Vz5zefvoH1qIAMa17UHWs
          EOF

      - name: Write Rails master key
        run: printf '%s' "${{ secrets.RAILS_MASTER_KEY }}" > config/master.key

      - name: Deploy with Kamal
        env:
          # Same GHCR PAT as local deploy — GITHUB_TOKEN gets read_package denied on
          # packages created earlier with a personal token.
          KAMAL_REGISTRY_USERNAME: ${{ secrets.KAMAL_REGISTRY_USERNAME }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
        run: bin/kamal deploy
