test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Shared festivo bucket with rocketbox/ prefix (no CreateBucket IAM for a dedicated bucket).
# Keys are prefixed in config/initializers/active_storage_s3_prefix.rb.
amazon:
  service: S3
  access_key_id: <%= Rails.application.credentials.dig(:s3, :access_key_id) %>
  secret_access_key: <%= Rails.application.credentials.dig(:s3, :secret_access_key) %>
  region: eu-west-1
  bucket: festivo
