---
# Before the client: the space
- name: Opening the Shop
  body: The barbershop at the start of the day, before any client arrives. Someone unlocks the door, switches on the lights and gets the space ready. A candid, documentary moment in the real shop, with no posing.
- name: Empty Chair
  body: The empty barber chair waiting for the next client, the station quiet between appointments. Shot at chair height in the real shop with available light. A calm pause with no people and nothing staged.
- name: Station Ready
  body: A workstation fully prepared for the next client, with the clean counter, mirror, chair and tools in their places. Natural framing as if the barber just stepped away. No people, no styled product display.
- name: Morning Light
  body: The shop interior in the early morning before work begins, with soft daylight coming through the windows across the floor, chairs and mirrors. Quiet, empty and atmospheric. The real space as it is.
- name: Tools Laid Out
  body: Clippers, scissors, combs and brushes laid out naturally on the station before work, the way the barber actually leaves them. A close or medium shot from above or at counter height. It should look used and real, not like an advertising flat lay.
- name: Mirror Detail
  body: A reflection in the shop mirror showing part of the room, a chair or tools on the counter. The mirror frame or edge stays visible so the reflection reads as a reflection. Quiet, layered and observational.
- name: Shop Texture
  body: A close-up of the materials that make up the shop, such as chair leather, metal, concrete, wood, tiles or fabric. Shallow depth of field with natural light raking across the surface. Abstract but recognizably this shop.
- name: Brand in the Space
  body: The shop's logo, sign or a signature brand detail seen naturally within the space, for example on a wall, mirror, window, cape or product. Part of a real scene rather than the subject of an ad. Off-centre and lived-in.

# Meeting the client
- name: Client Arrival
  body: A client walking through the door or having just stepped inside the shop. A candid moment caught mid-motion, with the doorway and interior around them. A natural welcome, no posing for the camera.
- name: Waiting Moment
  body: A client waiting on the sofa or a chair before their turn, perhaps looking around or at their phone. An unposed, observational shot from across the room. A relaxed, everyday atmosphere.
- name: Consultation
  body: A short conversation between barber and client before the haircut, with the client already seated and the barber standing beside them. Gestures and attention in the moment, filmed candidly. Nobody looks at the camera.
- name: Hair Assessment
  body: The barber examining the client's starting length and hair structure, running fingers through or lifting sections. A close-to-medium shot that focuses on hands and hair. The real moment before the first cut.
- name: Mirror Discussion
  body: Client and barber discussing the result they want through the mirror, with both faces visible in the reflection. The barber may point to or frame an area of the head. A genuine conversation, not a pose.
- name: Cape Up
  body: The barber swings the cape over the seated client and fastens it at the neck, the first step before the cut. A candid medium shot with hands and cape in motion and the shop softly blurred behind.
- name: Chair Adjustment
  body: The barber adjusting the chair height or headrest for the client before starting. Hands on the lever or headrest, with a functional, practical feel. Shot from the side at working height.

# The haircut
- name: First Pass
  body: The first deliberate pass with the clipper or scissors, the moment the haircut really begins. Focus on the tool meeting the hair, with the client's head and the barber's hand in frame. Real working position, no staging.
- name: Clipper Work
  body: The clipper in a real working position against the side or back of the head, guided by the barber's hand. Physically correct grip and angle, with fine hair coming away. A close-to-medium shot.
- name: Scissor Work
  body: The barber cutting with scissors and a comb, holding a section of hair between the fingers. Focus on hands, blades and hair, with the client's head in soft context. Precise, real technique.
- name: Comb Through
  body: The barber combing through the hair to check the shape and evenness mid-cut. A medium-close shot with the comb in motion and the barber's attention visible. A natural rhythm of work.
- name: Fade Building
  body: The barber working on the fade, blending the gradient on the side or back of the head with the clipper. Close framing on the transition zone and the tool. Real, careful work in progress.
- name: Temple Detail
  body: Precise work near the temple with a trimmer, clipper corner or scissor tips. A tight close-up showing the hairline, skin and tool. Steady, careful and detailed.
- name: Ear Detail
  body: Careful trimming around the ear, with the barber gently folding the ear down or holding it aside. A close shot of hands, tool and the clean line forming. Delicate and real.
- name: Neckline Work
  body: The barber shaping the neckline at the back of the head, often with the client's head tilted slightly forward. Shot from behind or over the shoulder, close on the nape and tool. Clean, precise lines.
- name: Top Texture
  body: Working the length and texture on top, with fingers lifting sections, scissors point-cutting or the clipper over the comb. A shot from slightly above that shows volume and movement. Real technique, not a styled result.
- name: Beard Detail
  body: A separate scene of beard work, such as trimming, shaping the cheek line or detailing with scissors or a trimmer. A close-to-medium shot of the face in profile or three-quarters. Focused and calm.
- name: Edge Up
  body: Precise outlining of the hairline or beard contour with a trimmer or straight razor. A tight shot on the edge being defined, with the barber's steady hand. Sharp detail and real concentration.
- name: Barber Inspecting
  body: The barber simply looking, stepping back slightly to assess the balance and symmetry of the shape. No tool in action, only attention. A quiet, telling pause, shot candidly.
- name: Pause Between Passes
  body: The tool lowered for a few seconds while the barber visually checks the work before the next pass. A natural break in rhythm, with the barber's eyes on the head and the clipper or scissors at rest. Unposed.
- name: Through the Mirror
  body: The haircut seen mostly through the mirror's reflection, with barber, client and tools visible in the glass. A layered, observational composition from behind or beside the chair. Real work in progress.
- name: Over the Shoulder
  body: The cut seen from an unusual point of view just behind the client's shoulder, looking past them toward the barber's hands or the mirror. An intimate perspective with the foreground softly out of focus.

# Micro-details of the process
- name: Cutting Trace / Hair Detail
  body: The traces of the cut up close, such as fine hairs on skin, fabric or the neck. A macro-level shot with shallow depth of field. Evidence that real work is happening, not a staged detail.
- name: Hair Falling
  body: Individual hairs caught mid-fall as they are cut, against the cape or the shop background. A fast, sharp shot with soft surroundings. A small, fleeting moment of the process.
- name: Hair on Tool
  body: A few cut hairs resting on a comb, brush or clipper blade. A close-up detail with natural light and shallow depth of field. Real and slightly imperfect.
- name: Cape Fold
  body: A fold of the cape with cut hairs caught in it, showing fabric texture and light. An abstract close-up that reads clearly as a haircut in progress. Natural, unstaged detail.
- name: Hand + Tool
  body: A physically correct close-up of the barber's hand holding a tool in a real working grip, such as a clipper, scissors or comb. Anatomically accurate fingers and a natural position. A hands-and-craft focus.
- name: Blade / Teeth Detail
  body: A close detail of clipper blades or comb teeth as part of real work, with hair visible on them or nearby. Macro framing with metal and plastic textures. A real tool in use, not a product shot.
- name: Spray / Moisture
  body: Water being sprayed from a spray bottle onto the hair, or wet hair being worked, when it fits the service. Fine mist and droplets caught in the light. A real step in the process.
- name: Product on Hands
  body: A small amount of styling product on the barber's fingertips or palms just before applying it. A close-up of hands and product texture with the client softly in the background. Natural, not a product ad.

# Finishing
- name: Neck Cleanup
  body: Cleaning the neck after the cut with a neck brush or towel, sweeping away loose hair. A close-to-medium shot from behind or the side. The satisfying final touches of real work.
- name: Final Comb
  body: The last strokes of the comb as the barber settles the finished shape. A medium-close shot with the comb in motion and the haircut almost done. Calm and precise.
- name: Styling Finish
  body: The barber styling the finished cut with fingers, a brush or a blow dryer to set the final shape. Real styling work, shot candidly. The result taking its final form.
- name: Final Inspection
  body: The barber stepping back to inspect the finished haircut from the side or behind. A focused, evaluating look with no tool in hand. Quiet pride in the work.
- name: Mirror Reveal
  body: The client looking properly at the result for the first time, either in the main mirror or a hand mirror the barber holds behind their head. The client's face and reaction are visible in the reflection. A genuine moment.
- name: Client Touches Hair
  body: The client running their fingers through the new cut, feeling the texture and length. A close-to-medium shot of hand and hair with a natural expression. Unposed.
- name: Checking the Fade
  body: The client turning their head toward the mirror to check the fade and sides. Shot from behind or beside the chair, with the turned head and its reflection visible. Real curiosity.
- name: Cape Off
  body: The barber removing the cape after the haircut, shaking off loose hair. A motion-filled medium shot with the fabric mid-swing. The end of the service.
- name: Loose Hair Cleanup
  body: The final removal of leftover hairs from the client's clothes or neck with a brush or hand. A close, practical shot. The small care that finishes a visit.

# The finished result
- name: Finished Haircut Portrait
  body: A natural portrait of the client with the finished haircut, seated in the chair or standing in the shop. Relaxed expression and real shop light, with the interior softly in the background. Not a studio portrait.
- name: Finished Profile
  body: A clean side profile of the client that highlights the shape and lines of the haircut. Even light with a softly blurred shop interior behind. Clear and honest.
- name: Rear Result
  body: The back of the head showing the finished fade and neckline. A sharp, well-lit shot from behind. A clear, honest view of the work.
- name: Haircut Macro
  body: The texture of the finished cut as close as possible, showing hair strands, the fade gradient or clean edges. A macro shot with shallow depth of field. Real detail of craft.
- name: Mirror Self-Check
  body: The client examining the result on their own in the mirror, turning their head or leaning closer. Their reflection is visible and the barber is out of focus or out of frame. A private, candid moment.
- name: Natural Reaction
  body: The client's genuine reaction to the result, such as a smile, interest or calm satisfaction. Not an advertising pose and not an exaggerated grin. A candid, human moment.
- name: Leaving the Chair
  body: The client getting up from the chair after the service. A medium shot caught in motion with the empty chair and station behind. A natural end to the visit.

# The barber as a person
- name: Barber Portrait at Work
  body: A portrait of the barber inside the real shop, at the station or beside the chair. A relaxed, confident expression in natural shop light. The person behind the craft, not a studio headshot.
- name: Focused Barber
  body: A close shot of the barber's face or eyes during concentration on the work. Shallow depth of field with the work softly in the foreground. Real focus.
- name: Hands of the Barber
  body: The barber's hands as the hero of the frame, at rest or at work, with their texture, rings or tattoos. A close shot in natural light. Expressive and real.
- name: Barber Waiting
  body: The barber in a free minute beside the chair, leaning, standing or sitting. A quiet, unposed moment between work. Shot from across the room.
- name: Barber at the Mirror
  body: The barber adjusting themselves, their clothes or their workspace in front of the mirror. A candid, human moment with the reflection visible. Not a vanity pose.
- name: Cleaning Tools
  body: The barber cleaning and disinfecting tools, such as brushing clipper blades or spraying disinfectant. A close-to-medium shot of a real routine. Care and professionalism.
- name: Resetting the Station
  body: The barber preparing the station for the next client by wiping the counter, arranging tools and refreshing the cape. A practical, real routine, shot candidly.
- name: Barber Break
  body: A short break with coffee, a phone or a moment of rest. Relaxed, everyday and unposed. The human side of the shop.
- name: Looking Outside
  body: The barber pausing by the window or door and looking out at the street. Natural light on the face with the shop interior around. A quiet, reflective moment.
- name: Between Clients
  body: A calm, everyday scene between clients with no specific action, just the barber and the shop as they are. Observational and unhurried.

# Life of the shop
- name: Two Barbers Working
  body: Two barbers working in parallel at neighbouring chairs. A wider shot that shows both stations and clients. The real rhythm of the shop.
- name: Busy Shop
  body: Several things happening at once, with clients in chairs, people waiting and barbers moving. No single main subject. Lively, real energy.
- name: Quiet Shop
  body: The empty or nearly empty shop between appointments. Still, calm and atmospheric, with natural light. The space at rest.
- name: Conversation
  body: An ordinary conversation between client and barber during the service. Natural expressions and gestures with nobody looking at the camera. The social side of the barbershop.
- name: Client on Phone
  body: A client on their phone while waiting or during the service, where that is realistic. An everyday, unposed moment. Shot candidly from a natural angle.
- name: Friends / Regulars
  body: Easy interaction between regular clients and barbers, such as a laugh, a handshake or casual talk. A warm, familiar atmosphere. Real people, not actors.
- name: Doorway Moment
  body: A person entering or leaving through the shop's real door. The doorway frames them, with street light and the interior meeting. Caught mid-motion.
- name: Street Through Window
  body: Street life seen through the shop window as part of the atmosphere, with passers-by, cars or the neighbourhood. The interior can frame the view. A sense of place.
- name: Reflection Layers
  body: Several spatial layers through mirrors, showing the shop, barbers and clients reflected multiple times. A complex but readable composition. Depth and atmosphere.
- name: Foreground Observation
  body: A scene shot as if from behind a chair, a tool or a doorway, with a soft foreground framing the action. An observational, voyeuristic feel. Real, unaware subjects.

# Objects and visual character
- name: Tool Still Life
  body: One or two work tools in their natural setting, such as a clipper on the counter or scissors beside a comb. Not an advertising still life. Real light and real wear.
- name: Products on Shelf
  body: The shop's real products and packaging on the shelf as they are actually displayed. Natural light and an honest arrangement. No product-ad styling.
- name: Chair Detail
  body: A close-up of the barber chair's details, such as stitching, leather, metal, levers or the footrest. Natural light and texture. The character of the chair.
- name: Workstation Detail
  body: Traces of real work on the station, such as scattered combs, a used towel, product jars or hair clippings. Honest and lived-in. A close-to-medium shot.
- name: Towel / Cape Stack
  body: A stack of towels or capes and other work materials. Fabric texture in soft light. Simple and real.
- name: Personal Detail
  body: A personal detail of the barber, such as a watch, a ring, a tattoo, shoes or a work apron. A close shot that tells something about the person. Natural and unposed.
- name: Shop Sign / Logo
  body: The shop's sign or logo as part of the environment, on the facade, a window or a wall, seen in context with real light and surroundings. Not an ad mock-up.
- name: Small Imperfection
  body: A natural imperfection that makes the shop real, such as a worn surface, a stray hair, a fingerprint or a working texture. A close-up in soft light. Character over polish.

# Closing
- name: Sweeping Hair
  body: Sweeping cut hair from the floor after a client, with the broom, the pile of hair and the chair base in frame. A practical, everyday end-of-service moment. Shot candidly.
- name: Cleaning the Chair
  body: Wiping down the barber chair after a client. A close-to-medium shot of hands, cloth and leather. Care and routine.
- name: End of Day Station
  body: The workstation after the last client, with the day's traces still on it and the tools put down. Evening light. Quiet and a little tired.
- name: Lights Going Off
  body: Closing the space as the lights switch off one by one and the shop goes dim. An atmospheric moment caught in transition.
- name: Empty Shop at Night
  body: The shop after the working day, dark inside except for a few lights or street light through the window. Still and moody. The space resting.
- name: Last Look Back
  body: A team member leaving for the night with the interior left behind them, perhaps a glance back from the door. Shot from inside or the doorway. A quiet end to the day.
