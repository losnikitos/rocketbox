<% %w[inbox photobank].each do |root| %>
<%= root %>:
  name: <%= root.humanize %>
  slug: <%= root %>
  color: <%= root == "inbox" ? "emerald" : "sky" %>
<% end %>
ready:
  name: Ready
  slug: ready
  parent: photobank
<% %w[business_card interior exterior logo customer misc working].each do |key| %>
<%= key %>:
  name: <%= key.humanize %>
  slug: <%= key.dasherize %>
  parent: inbox
  color: emerald
photobank_<%= key %>:
  name: <%= key.humanize %>
  slug: <%= key.dasherize %>
  parent: photobank
<% end %>
prompts:
  name: Prompts
  slug: prompts
  color: violet
  kind: prompt
<% %w[shots ready].each do |key| %>
prompts_<%= key %>:
  name: <%= key.humanize %>
  slug: <%= key %>
  parent: prompts
  color: violet
  kind: prompt
<% end %>
reviews:
  name: Reviews
  slug: reviews
  color: amber
  kind: review
